name: Publicar WMS sem PAT
on:
  push:
    branches: [main]
    paths:
      - 'wms-piloto-publicacao.zip'
      - 'wms-m18-transferencia.zip'
      - 'wms-m18-transferencia (1).zip'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Pacote a publicar'
        type: choice
        default: m18-transfer
        options:
          - m18-transfer
          - standard
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: wms-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'kennidyroger04-wq/wms-piloto' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Selecionar pacote enviado
        id: package
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          SELECTED_PACKAGE: ${{ inputs.package }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          standard='wms-piloto-publicacao.zip'
          transfers=['wms-m18-transferencia.zip','wms-m18-transferencia (1).zip']
          selected=os.environ.get('SELECTED_PACKAGE','')
          if os.environ['EVENT_NAME']=='push':
              before=os.environ.get('BEFORE_SHA','')
              changed=set()
              if len(before)==40 and before!='0'*40:
                  changed=set(subprocess.check_output(['git','diff','--name-only',before,'HEAD'],text=True).splitlines())
              candidates=[name for name in transfers if name in changed and Path(name).is_file()]
              if standard in changed and Path(standard).is_file():
                  if candidates:
                      raise SystemExit('Dois tipos de pacote alterados. Selecione explicitamente pelo Run workflow.')
                  selected='standard'
              else:
                  selected='m18-transfer' if candidates or any(Path(name).is_file() for name in transfers) else 'standard'
          if selected=='standard':
              filename=standard
          elif selected=='m18-transfer':
              # Prefer the canonical artifact; duplicate downloads are supported.
              filename=next((name for name in transfers if Path(name).is_file()),None)
              if not filename:
                  raise SystemExit('Pacote M18 de transferência não encontrado.')
          else:
              raise SystemExit('Seleção de pacote inválida.')
          if not Path(filename).is_file():
              raise SystemExit('Pacote não encontrado: '+filename)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('filename='+filename+'\n')
          print('Pacote selecionado: '+filename)
          PY
      - name: Validar pacote aprovado e preparar site
        env:
          WMS_PACKAGE: ${{ steps.package.outputs.filename }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, re, os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          releases = {
              'wms-m17-github-pages.zip': ('4c1b1b3c570ae804667471ce6844ead287e0958369f40f0ed8055c2965f505a4','#0f172a'),
              'wms-m18-github-pages.zip': ('dc55e5c5741745f4ae4613606220460ffc51a927d6120855cdafcfb7e79472db','#800b25'),
          }
          package = Path(os.environ['WMS_PACKAGE'])
          if package.name == 'wms-piloto-publicacao.zip':
              payload = package.read_bytes()
          else:
              # The Actions download contains the actual publication ZIP and the workflow.
              # The nested workflow is never executed or copied to the site.
              with ZipFile(package) as transfer:
                  if sorted(transfer.namelist()) != ['publish.yml','wms-piloto-publicacao.zip'] or sum(item.file_size for item in transfer.infolist()) > 20*1024*1024:
                      raise SystemExit('Artefato de transferência inesperado.')
                  payload = transfer.read('wms-piloto-publicacao.zip')
          with ZipFile(io.BytesIO(payload)) as outer:
              names = outer.namelist()
              if (len(names) != 2 or 'pilot-config.json' not in names
                      or sum(x.file_size for x in outer.infolist()) > 20*1024*1024):
                  raise SystemExit('Pacote de transferência inesperado.')
              static = next(name for name in names if name != 'pilot-config.json')
              if static not in releases:
                  raise SystemExit('Versão estática não reconhecida.')
              data = outer.read(static)
              config = json.loads(outer.read('pilot-config.json'))
          expected, theme = releases[static]
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('ZIP estático não corresponde à versão aprovada.')
          if not isinstance(config,dict) or set(config) != {'url','key','restaurant'} or config['url'] != 'https://xeyxoetdtgqhtlesfdme.supabase.co' or not re.fullmatch(r'sb_publishable_[A-Za-z0-9_-]{16,}',config['key']) or not re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}',config['restaurant'],re.I):
              raise SystemExit('Configuração pública inválida.')
          site = Path('_site')
          site.mkdir()
          with ZipFile(io.BytesIO(data)) as archive:
              names = archive.namelist()
              if (len(names) > 100 or len(names) != len(set(names))
                      or sum(item.file_size for item in archive.infolist()) > 20*1024*1024):
                  raise SystemExit('Estrutura do artefato inesperada.')
              required = {'index.html','manifest.webmanifest','sw-m13.js','install.js','.nojekyll',
                          'icons/wms-192.png','icons/wms-512.png'}
              manifest = json.loads(archive.read('manifest.webmanifest'))
              if (not required.issubset(names) or manifest.get('theme_color') != theme
                      or manifest.get('start_url') != './?mobile=true' or manifest.get('scope') != './'):
                  raise SystemExit('Ativos ou manifesto do PWA incorretos.')
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  allowed = path.as_posix() in required | {'favicon.ico','modelo-catalogo.csv',
                      'modelo-catalogo.xlsx','modelo-faturamento.csv','modelo-faturamento.xlsx',
                      'modelo-movimentacoes.csv','modelo-movimentacoes.xlsx','exemplo-nfe.xml',
                      'icons/apple-touch-icon.png'} or (
                      path.parts[:2] == ('_expo','static') and path.suffix in {'.js','.css'}) or (
                      path.parts[:1] == ('assets',) and path.suffix == '.wasm')
                  if (not allowed or path.is_absolute() or '..' in path.parts or chr(92) in item.filename
                          or path.as_posix() != item.filename):
                      raise SystemExit('Entrada não permitida no artefato.')
                  target = site.joinpath(*path.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.read(item))
          (site/'pilot-config.json').write_text(json.dumps(config)+'\n')
          version = 'M18' if static == 'wms-m18-github-pages.zip' else 'M17'
          if package.name != 'wms-piloto-publicacao.zip' and version != 'M18':
              raise SystemExit('O artefato de transferência M18 não contém a versão M18.')
          (site/'wms-version.json').write_text(json.dumps({'version':version,'sha256':expected})+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('### Versão publicada: '+version+'\n\nPacote validado: '+static+'\n')
          print('Ativos conferidos para ' + static)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Confirmar disponibilidade do artefato Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.error
          endpoint=f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?name=github-pages"
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(urllib.request.Request(endpoint,headers=headers),timeout=15) as response:
                      artifacts=json.load(response).get('artifacts',[])
                  matches=[a for a in artifacts if a.get('name')=='github-pages' and not a.get('expired')]
                  if len(matches)==1:
                      print('Artefato Pages confirmado na API.')
                      time.sleep(5)
                      break
                  if len(matches)>1:
                      raise SystemExit('Mais de um artefato Pages encontrado.')
              except urllib.error.HTTPError as exc:
                  if exc.code not in (429,500,502,503,504):
                      raise SystemExit(f'Consulta de artefatos falhou: HTTP {exc.code}')
              except (urllib.error.URLError,TimeoutError):
                  pass
              time.sleep(5)
          else:
              raise SystemExit('Artefato ainda indisponível para publicação.')
          PY
      - uses: actions/deploy-pages@v4
        id: deploy
